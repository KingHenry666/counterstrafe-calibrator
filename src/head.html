<title>急停标定台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a dark training range. Top bar + 1120px content column for home/setup/results; the scenario is a fixed full-screen canvas with a HUD layered on top. */
:root {
  --bg: #0b1013;
  --bg-2: #121a1f;
  --bg-3: #1a252c;
  --line: #233038;
  --line-2: #2e3f49;
  --fg: #e7edf0;
  --fg-2: #a3b3bc;
  --fg-3: #65798a;
  --accent: #f2b544;
  --accent-2: #ffd27a;
  --accent-dim: rgba(242, 181, 68, 0.14);
  --hit: #5ad38a;
  --miss: #ff6b6b;
  --info: #7cc7e8;
  --font-display: "Chakra Petch", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
a { color: var(--info); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { min-height: 100%; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: rgba(11, 16, 19, 0.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); }
.brand b { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
.brand span { font-size: 12px; color: var(--fg-3); letter-spacing: 0.06em; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--fg-2); padding: 6px 12px; border-radius: 6px; font-size: 14px; }
.nav a.on { color: var(--fg); background: var(--bg-3); }
.pill { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; }
.pill.acc { border-color: var(--accent); color: var(--accent); }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex: 1; }
.lead { color: var(--fg-2); max-width: 64ch; }
.lead strong { color: var(--fg); font-weight: 500; }
.section { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head .meta { color: var(--fg-3); font-size: 13px; }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.locked { opacity: 0.55; }
.card .eyebrow { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
.card h3 { font-size: 18px; }
.card .desc { color: var(--fg-2); font-size: 14px; }
.card .stats { display: flex; gap: 18px; margin-top: auto; padding-top: 6px; }
.card .stats div { display: flex; flex-direction: column; }
.card .stats b { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.card .stats span { font-size: 12px; color: var(--fg-3); }
.card .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg); cursor: pointer; text-decoration: none; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1409; font-weight: 700; }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.primary:disabled { background: var(--bg-3); border-color: var(--line); color: var(--fg-3); cursor: not-allowed; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; }

.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h3 { display: flex; align-items: center; gap: 10px; }
.panel .hint { color: var(--fg-3); font-size: 13px; }
.two { display: grid; gap: 16px; grid-template-columns: 1.4fr 1fr; align-items: start; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-of-type { border-top: 0; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.check .where { font-family: var(--font-display); font-size: 11px; color: var(--fg-3); letter-spacing: 0.06em; text-transform: uppercase; }
.check .what { font-size: 14px; }
.check .what b { color: var(--accent-2); font-weight: 500; }
.progress { height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; color: var(--fg-2); }
.field input, .field select { background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; color: var(--fg); font-family: var(--font-mono); font-size: 14px; width: 100%; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; font-family: var(--font-mono); }

.selfcheck { display: flex; flex-direction: column; gap: 10px; }
.keypad { display: flex; gap: 6px; flex-wrap: wrap; }
.key { font-family: var(--font-display); font-weight: 600; width: 44px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); color: var(--fg-2); transition: background 0.08s, color 0.08s; }
.key.wide { width: 110px; }
.key.seen { border-color: var(--fg-3); color: var(--fg); }
.key.down { background: var(--accent); color: #1a1409; border-color: var(--accent); }
.firepad { border: 1px dashed var(--line-2); border-radius: 8px; padding: 14px; text-align: center; color: var(--fg-2); cursor: crosshair; user-select: none; }
.firepad.down { background: var(--accent-dim); border-color: var(--accent); color: var(--fg); }
.evlog { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 92px; white-space: pre; overflow-x: auto; }

details.adv { border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; }
details.adv summary { cursor: pointer; padding: 10px 0; color: var(--fg-2); font-size: 14px; }
details.adv .fields { padding: 4px 0 14px; }

/* ---------- scenario (full screen) ---------- */
#view-scene { position: fixed; inset: 0; z-index: 20; background: var(--bg); cursor: none; }
#view-scene.ui-cursor { cursor: default; }
#canvas-host { position: absolute; inset: 0; }
#canvas-host canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; inset: 0; pointer-events: none; padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.hud-tl { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 14px; align-items: center; font-family: var(--font-display); }
.hud-tl .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hud-tl .n small { font-size: 13px; color: var(--fg-3); font-weight: 500; margin-left: 4px; }
.hud-tl .tag { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
.hud-tr { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; pointer-events: auto; }
.hud-tr .btn { background: rgba(18, 26, 31, 0.8); }
.hud-msg { position: absolute; top: 18%; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: 0.02em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); transition: opacity 0.15s; }
.hud-msg .dir { color: var(--accent); }
.hud-msg.cue { color: var(--accent); font-size: 30px; }
.hud-sub { position: absolute; top: calc(18% + 40px); left: 0; right: 0; text-align: center; font-size: 14px; color: var(--fg-2); }
.flash { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--miss); opacity: 0; transition: opacity 0.12s; }
.flash.on { opacity: 1; }
.readout { position: absolute; top: 62%; left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: 15px; color: var(--fg-2); opacity: 0; transition: opacity 0.12s; }
.readout.on { opacity: 1; }
.readout b { color: var(--fg); font-weight: 600; }
.readout .ok { color: var(--hit); }
.readout .bad { color: var(--miss); }
.crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.crosshair i { position: absolute; background: #e8fff1; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
.crosshair .l { width: 6px; height: 2px; left: -10px; top: -1px; }
.crosshair .r { width: 6px; height: 2px; left: 4px; top: -1px; }
.crosshair .u { width: 2px; height: 6px; left: -1px; top: -10px; }
.crosshair .d { width: 2px; height: 6px; left: -1px; top: 4px; }
.hitmark { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
.hitmark.on { opacity: 1; }
.hitmark i { position: absolute; width: 9px; height: 2px; background: var(--hit); left: -4px; top: -1px; transform-origin: center; }
.hitmark i:nth-child(1) { transform: translate(-7px, -7px) rotate(45deg); }
.hitmark i:nth-child(2) { transform: translate(7px, -7px) rotate(-45deg); }
.hitmark i:nth-child(3) { transform: translate(-7px, 7px) rotate(-45deg); }
.hitmark i:nth-child(4) { transform: translate(7px, 7px) rotate(45deg); }
.speed { position: absolute; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(360px, 70vw); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.speed .bar { position: relative; width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
.speed .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--hit); }
.speed .bar i.moving { background: var(--accent); }
.speed .bar em { position: absolute; left: 10%; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: 0.7; }
.speed .lbl { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); display: flex; gap: 14px; }
.speed .lbl b { color: var(--fg-2); font-variant-numeric: tabular-nums; }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(11, 16, 19, 0.78); backdrop-filter: blur(4px); pointer-events: auto; cursor: default; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.overlay .box { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 26px 28px; max-width: 520px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.overlay h2 { font-size: 24px; }
.overlay .steps { display: flex; flex-direction: column; gap: 6px; color: var(--fg-2); font-size: 14px; }
.overlay .steps b { color: var(--accent-2); font-weight: 500; }
.overlay .row { display: flex; gap: 8px; flex-wrap: wrap; }
.bigscore { display: flex; align-items: baseline; gap: 12px; }
.bigscore b { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.bigscore span { color: var(--fg-3); font-size: 13px; }
.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.mini-stats div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.mini-stats b { font-family: var(--font-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mini-stats span { font-size: 12px; color: var(--fg-3); }

/* ---------- results ---------- */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile b { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile b small { font-size: 14px; color: var(--fg-3); font-weight: 500; margin-left: 3px; }
.tile span { font-size: 12px; color: var(--fg-3); }
.tile.score b { color: var(--accent); }
.split { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.split .panel ul { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.split .panel ul b { color: var(--fg); font-weight: 500; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); border-top: 0; font-weight: 600; }
td.v { font-family: var(--font-mono); white-space: nowrap; }
td.why { color: var(--fg-2); }
.lv { display: inline-block; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
.lv-green { color: var(--hit); border-color: rgba(90, 211, 138, 0.5); }
.lv-yellow { color: var(--accent); border-color: rgba(242, 181, 68, 0.55); }
.lv-orange { color: #ff9b5c; border-color: rgba(255, 155, 92, 0.55); }
.status { font-size: 12px; color: var(--fg-3); }
.status.measured { color: var(--info); }
.dks { display: grid; grid-template-columns: 110px repeat(4, 1fr); gap: 4px; align-items: stretch; font-size: 12px; min-width: 460px; }
.dks .h { font-family: var(--font-display); font-size: 11px; color: var(--fg-3); text-align: center; letter-spacing: 0.04em; padding: 4px 0; }
.dks .h b { display: block; color: var(--fg); font-size: 13px; }
.dks .slot { display: flex; align-items: center; font-family: var(--font-mono); color: var(--fg-2); padding-left: 4px; }
.dks .slot b { display: inline-flex; align-items: center; justify-content: center; min-width: 42px; height: 26px; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 4px; color: var(--fg); margin-right: 6px; }
.dks .c { height: 30px; display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; position: relative; }
.dks .c.empty::after { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--fg-3); }
.dks .c.tap::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
.dks .c.hs::after, .dks .c.hm::after, .dks .c.he::after { content: ""; position: absolute; top: 10px; bottom: 10px; background: var(--accent); }
.dks .c.hs::after { left: 10px; right: -3px; border-radius: 5px 0 0 5px; }
.dks .c.hm::after { left: -3px; right: -3px; }
.dks .c.he::after { left: -3px; right: 10px; border-radius: 0 5px 5px 0; }
.dks .c.hs::before, .dks .c.he::before { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); z-index: 1; }
.dks .c.hs::before { left: 9px; }
.dks .c.he::before { right: 9px; }
.note { font-size: 13px; color: var(--fg-2); background: var(--accent-dim); border: 1px solid rgba(242,181,68,0.3); border-radius: 8px; padding: 10px 14px; }
.note.warn { color: #ffb48c; background: rgba(255,155,92,0.1); border-color: rgba(255,155,92,0.35); }
textarea.export { width: 100%; min-height: 120px; background: var(--bg); color: var(--fg-2); border: 1px solid var(--line-2); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; padding: 10px; resize: vertical; }
.empty { border: 1px dashed var(--line-2); border-radius: 10px; padding: 40px; text-align: center; color: var(--fg-2); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.src { font-size: 13px; color: var(--fg-3); }
.src a { color: var(--info); }
footer { border-top: 1px solid var(--line); color: var(--fg-3); font-size: 12px; }
footer .in { max-width: 1120px; margin: 0 auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 50; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
.toast.on { opacity: 1; }
.mobile-note { background: var(--accent-dim); border-bottom: 1px solid rgba(242,181,68,0.3); color: var(--fg); font-size: 13px; text-align: center; padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
